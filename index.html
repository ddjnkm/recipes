<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid rgba(128, 128, 128, 0.3);
      padding: 1.5rem 1rem;
    }
    aside h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    .home { color: inherit; text-decoration: none; cursor: pointer; }
    .home:hover { text-decoration: underline; }
    .add {
      display: inline-block;
      margin: 0 0 1rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    .add:hover { background: rgba(128, 128, 128, 0.15); }
    #addForm { display: grid; gap: 1rem; max-width: 640px; }
    #addForm label { display: grid; gap: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    #addForm .opt { font-weight: 400; opacity: 0.6; }
    #addForm input, #addForm textarea {
      font: inherit;
      padding: 0.5rem;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      width: 100%;
      box-sizing: border-box;
    }
    #addForm textarea { resize: vertical; min-height: 12rem; }
    #addForm button[type="submit"] {
      justify-self: start;
      padding: 0.5rem 1rem;
      font: inherit;
      cursor: pointer;
      border: 1px solid rgba(128, 128, 128, 0.5);
      border-radius: 6px;
      background: transparent;
      color: inherit;
    }
    #addForm button[type="submit"]:hover { background: rgba(128, 128, 128, 0.15); }
    .tokenbox {
      font-size: 0.85rem;
      border: 1px solid rgba(128, 128, 128, 0.3);
      border-radius: 6px;
      padding: 0.75rem;
    }
    .tokenbox small { display: block; margin-top: 0.4rem; opacity: 0.75; }
    .tokenbox button { font: inherit; cursor: pointer; }
    #saveTok { margin-top: 0.5rem; }
    .status-error { color: #c0392b; }
    .status-ok { color: #1e8e3e; }
    #browse summary {
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }
    #browse[open] summary { margin-bottom: 0.25rem; }
    nav ul { list-style: none; margin: 0; padding: 0; }
    nav li { margin: 0.25rem 0; }
    nav a {
      display: block;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
    }
    nav a:hover { background: rgba(128, 128, 128, 0.15); }
    nav a.active { background: rgba(128, 128, 128, 0.25); font-weight: 600; }
    main { padding: 2rem 2.5rem; max-width: 720px; }
    main img { max-width: 100%; }
    .empty { opacity: 0.7; }
    @media (max-width: 640px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid rgba(128, 128, 128, 0.3); }
    }
  </style>
</head>
<body>
  <aside>
    <h1><a href="#" id="home" class="home">Recipes</a></h1>
    <button class="add" id="addBtn" type="button">+ Add a recipe</button>
    <details id="browse" open>
      <summary>All recipes</summary>
      <nav><ul id="list"><li class="empty">Loading…</li></ul></nav>
    </details>
  </aside>
  <main id="content">
    <p class="empty">Select a recipe from the list.</p>
  </main>

  <script>
    const list = document.getElementById("list");
    const content = document.getElementById("content");
    const RECIPES_DIR = "recipes/";

    // Strip YAML front matter before rendering so it never shows on the page.
    function stripFrontMatter(text) {
      return text.replace(/^---\s*\n[\s\S]*?\n---\s*\n/, "");
    }

    // A tiny, self-contained markdown renderer. The recipes only use headings,
    // lists, bold, italics, inline code and links, so full markdown is overkill
    // and an external library would be an extra dependency to break.
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function inline(s) {
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
          '<a href="$2" rel="noopener">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|[^_])_([^_]+)_/g, "$1<em>$2</em>");
    }

    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          out.push(`<h${level}>${inline(heading[2].trim())}</h${level}>`);
          i++;
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(`<li>${inline(lines[i].replace(/^\s*[-*]\s+/, ""))}</li>`);
            i++;
          }
          out.push(`<ul>${items.join("")}</ul>`);
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(`<li>${inline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
            i++;
          }
          out.push(`<ol>${items.join("")}</ol>`);
          continue;
        }

        const para = [];
        while (i < lines.length && lines[i].trim() &&
               !/^(#{1,6}\s|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) {
          para.push(inline(lines[i].trim()));
          i++;
        }
        out.push(`<p>${para.join("<br>")}</p>`);
      }
      return out.join("\n");
    }

    async function showRecipe(file, link) {
      document.querySelectorAll("nav a.active").forEach(a => a.classList.remove("active"));
      if (link) link.classList.add("active");
      content.innerHTML = "<p class='empty'>Loading…</p>";
      try {
        const res = await fetch(RECIPES_DIR + encodeURIComponent(file));
        if (!res.ok) throw new Error(res.status);
        const md = stripFrontMatter(await res.text());
        content.innerHTML = renderMarkdown(md);
        location.hash = encodeURIComponent(file);
        // The recipe renders in place, below the list.
      } catch (err) {
        content.innerHTML = "<p class='empty'>Could not load this recipe.</p>";
      }
    }

    // Return to the empty "home" view with no recipe selected.
    function goHome() {
      document.querySelectorAll("nav a.active").forEach(a => a.classList.remove("active"));
      content.innerHTML = "<p class='empty'>Select a recipe from the list.</p>";
      history.replaceState(null, "", location.pathname + location.search);
      document.getElementById("browse").open = true;
      window.scrollTo(0, 0);
    }

    document.getElementById("home").addEventListener("click", (e) => {
      e.preventDefault();
      goHome();
    });

    // --- Add a recipe from the site ---------------------------------------
    // Submits a GitHub issue that the existing "Add recipe" workflow formats
    // and commits. Auth uses a personal access token kept only in this
    // browser's localStorage (never sent anywhere but api.github.com).
    const REPO = "ddjnkm/recipes";
    const TOKEN_KEY = "gh_token";

    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
    }
    function setToken(value) {
      try {
        if (value) localStorage.setItem(TOKEN_KEY, value);
        else localStorage.removeItem(TOKEN_KEY);
      } catch (e) { /* private mode: token just won't persist */ }
    }

    function tokenBoxHtml() {
      if (getToken()) {
        return "Using a saved GitHub token. " +
          "<button type='button' id='clearTok'>Remove token</button>";
      }
      return "<label>GitHub token" +
        "<input id='f-token' type='password' autocomplete='off' placeholder='github_pat_...'></label>" +
        "<button type='button' id='saveTok'>Save token</button>" +
        "<small>Create a fine-grained token with <b>Issues: Read and write</b> on this " +
        "repository. It is stored only in this browser. " +
        "<a href='https://github.com/settings/personal-access-tokens/new' target='_blank' " +
        "rel='noopener'>Create one</a>.</small>";
    }

    function refreshTokenBox() {
      document.getElementById("tokenbox").innerHTML = tokenBoxHtml();
      wireTokenBox();
    }

    function wireTokenBox() {
      const clearTok = document.getElementById("clearTok");
      if (clearTok) {
        clearTok.addEventListener("click", () => {
          setToken("");
          refreshTokenBox();
        });
      }
      const saveTok = document.getElementById("saveTok");
      if (saveTok) {
        saveTok.addEventListener("click", () => {
          const input = document.getElementById("f-token");
          const value = input ? input.value.trim() : "";
          if (!value) { setStatus("Enter a token to save.", "error"); return; }
          setToken(value);
          refreshTokenBox();
          setStatus("Token saved.", "ok");
        });
      }
    }

    function setStatus(msg, kind) {
      const el = document.getElementById("f-status");
      el.className = kind === "error" ? "status-error" : kind === "ok" ? "status-ok" : "empty";
      el.innerHTML = msg;
    }

    function showAddForm() {
      document.querySelectorAll("nav a.active").forEach(a => a.classList.remove("active"));
      content.innerHTML =
        "<h1>Add a recipe</h1>" +
        "<form id='addForm'>" +
          "<div class='tokenbox' id='tokenbox'>" + tokenBoxHtml() + "</div>" +
          "<label>Title <span class='opt'>(optional)</span>" +
            "<input id='f-title' type='text' autocomplete='off'></label>" +
          "<label>Recipe text" +
            "<textarea id='f-text' required></textarea></label>" +
          "<label>Source link <span class='opt'>(optional)</span>" +
            "<input id='f-source' type='url' autocomplete='off' placeholder='https://...'></label>" +
          "<button type='submit'>Submit recipe</button>" +
          "<p id='f-status'></p>" +
        "</form>";
      window.scrollTo(0, 0);
      wireTokenBox();
      document.getElementById("addForm").addEventListener("submit", submitRecipe);
    }

    async function submitRecipe(e) {
      e.preventDefault();
      const tokenInput = document.getElementById("f-token");
      const token = getToken() || (tokenInput ? tokenInput.value.trim() : "");
      const title = document.getElementById("f-title").value.trim();
      const text = document.getElementById("f-text").value.trim();
      const source = document.getElementById("f-source").value.trim();

      if (!token) { setStatus("Please save a GitHub token first.", "error"); return; }
      if (!text) { setStatus("Recipe text is required.", "error"); return; }

      // Match the issue-form body the workflow expects.
      const body =
        "### Title\n\n" + (title || "_No response_") +
        "\n\n### Recipe text\n\n" + text +
        "\n\n### Source link\n\n" + (source || "_No response_");
      const firstLine = (text.split("\n").find(l => l.trim()) || "Recipe")
        .replace(/^#+\s*/, "").trim();
      const issueTitle = (title || firstLine).slice(0, 80) || "Recipe";

      setStatus("Submitting…", null);
      try {
        const res = await fetch("https://api.github.com/repos/" + REPO + "/issues", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ title: issueTitle, body: body })
        });
        if (!res.ok) {
          let msg = res.status + " " + res.statusText;
          try { const j = await res.json(); if (j && j.message) msg = j.message; } catch (e) {}
          throw new Error(msg);
        }
        const issue = await res.json();
        setStatus(
          "Submitted. Your recipe will appear on the site a minute or two after it is " +
          "processed. <a href='" + issue.html_url + "' target='_blank' rel='noopener'>" +
          "View submission</a>.",
          "ok"
        );
        document.getElementById("f-title").value = "";
        document.getElementById("f-text").value = "";
        document.getElementById("f-source").value = "";
      } catch (err) {
        setStatus("Could not submit: " + err.message, "error");
      }
    }

    document.getElementById("addBtn").addEventListener("click", showAddForm);

    async function init() {
      let recipes;
      try {
        const res = await fetch("recipes.json");
        if (!res.ok) throw new Error(res.status);
        recipes = await res.json();
      } catch (err) {
        list.innerHTML = "<li class='empty'>Could not load recipe list.</li>";
        return;
      }

      if (!recipes.length) {
        list.innerHTML = "<li class='empty'>No recipes yet.</li>";
        return;
      }

      list.innerHTML = "";
      const links = {};
      for (const recipe of recipes) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#" + encodeURIComponent(recipe.file);
        a.textContent = recipe.title;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          showRecipe(recipe.file, a);
        });
        li.appendChild(a);
        list.appendChild(li);
        links[recipe.file] = a;
      }

      const current = decodeURIComponent(location.hash.slice(1));
      if (current && links[current]) {
        showRecipe(current, links[current]);
      }
    }

    init();
  </script>
</body>
</html>
