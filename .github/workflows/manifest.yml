name: Sync manifest

# Keep recipes.json in sync whenever a recipe file changes on main, including
# edits committed directly (e.g. from the site's editor) or by hand.
on:
  push:
    branches: [main]
    paths:
      - "recipes/**"

permissions:
  contents: write

concurrency:
  group: sync-manifest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild manifest
        run: python scripts/build_manifest.py

      - name: Commit if changed
        run: |
          git config user.name "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add recipes.json
          if git diff --staged --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi
          git commit -m "Sync recipes.json"
          git pull --rebase
          git push
