name: Capture recipe

on:
  repository_dispatch:
    types: [recipe]
  workflow_dispatch:
    inputs:
      url:
        description: "Page or video URL"
        required: false
      text:
        description: "Pasted caption or recipe text"
        required: false
      source_url:
        description: "Attribution link for pasted text"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: capture-recipe
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic trafilatura yt-dlp

      - name: Extract and write recipe
        id: extract
        env:
          # Payload values are passed as env vars, never interpolated into the
          # shell command itself. This keeps arbitrary pasted text from being
          # executed by the runner.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPE_URL: ${{ github.event.client_payload.url || inputs.url }}
          RECIPE_TEXT: ${{ github.event.client_payload.text || inputs.text }}
          RECIPE_SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url }}
        run: python scripts/capture_recipe.py

      - name: Commit
        run: |
          git config user.name "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add recipes sources
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add ${{ steps.extract.outputs.slug }}"
          git pull --rebase
          git push

      - name: Open an issue if capture failed
        if: failure()
        uses: actions/github-script@v7
        env:
          FAILED_URL: ${{ github.event.client_payload.url || inputs.url }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Recipe capture failed",
              body: [
                "Source: " + (process.env.FAILED_URL || "(pasted text)"),
                "",
                "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                  context.repo.repo + "/actions/runs/" + context.runId
              ].join("\n")
            });
