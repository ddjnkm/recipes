name: Add recipe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-recipe
  cancel-in-progress: false

jobs:
  add:
    # Only handle issues created from the "Add a recipe" form (labeled recipe).
    if: contains(join(github.event.issue.labels.*.name, ','), 'recipe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and write recipe
        id: write
        env:
          # The issue body is passed as an env var, never interpolated into the
          # shell command, so pasted text can never be executed by the runner.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/format_recipe.py

      - name: Commit
        id: commit
        run: |
          git config user.name "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add recipes recipes.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add ${{ steps.write.outputs.slug }}"
          git pull --rebase
          git push

      - name: Comment and close on success
        if: success()
        uses: actions/github-script@v7
        env:
          RECIPE_FILE: ${{ steps.write.outputs.file }}
        with:
          script: |
            const file = process.env.RECIPE_FILE;
            const site = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Added `recipes/" + file + "`.",
                "",
                "It will appear on the site shortly: " + site
              ].join("\n")
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Could not add this recipe. The recipe text may be empty.",
                "",
                "Details: " + run
              ].join("\n")
            });
